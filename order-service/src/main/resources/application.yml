spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3307/order_db
    username: order_user
    password: order_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    serviceclient:
      product-service:              # client group name, used in HttpClientConfig
        base-url: http://localhost:8081
        connect-timeout: 2s         # time to open the connection
        read-timeout: 3s            # time to wait for the response

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: debug
