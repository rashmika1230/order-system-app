spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3307/product_db
    username: product_user
    password: product_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: debug
