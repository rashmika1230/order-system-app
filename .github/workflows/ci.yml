name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change to this workflow re-tests every service
          filters: |
            product-service:
              - 'product-service/**'
              - '.github/workflows/ci.yml'
            order-service:
              - 'order-service/**'
              - '.github/workflows/ci.yml'
            api-gateway:
              - 'api-gateway/**'
              - '.github/workflows/ci.yml'

  test:
    name: Test ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and run all tests (unit + Testcontainers integration)
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  build-scan-push:
    name: Build, scan and push ${{ matrix.service }}
    needs: [changes, test]
    if: github.event_name == 'push' && needs.changes.outputs.services != '[]' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      REPOSITORY: order-system/${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get temporary AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Set image name
        run: echo "IMAGE=${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      # ECR tags are immutable, so re-running a workflow for the same commit must not fail
      - name: Check whether this commit's image already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists, skipping build"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.found == 'false'

      - name: Build image (not pushed yet)
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for critical vulnerabilities
        if: steps.exists.outputs.found == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push image to ECR
        if: steps.exists.outputs.found == 'false'
        run: docker push "$IMAGE"

      - name: Summary
        run: |
          echo "### ${{ matrix.service }}: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  update-helm:
    name: Open deployment PR in order-system-helm
    needs: [changes, build-scan-push]
    if: github.event_name == 'push' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Helm repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rashmika1230/order-system-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm

      - name: Update image tags in environments/prod/values.yaml
        working-directory: helm
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            yq -i ".services.\"$svc\".image.tag = \"$IMAGE_TAG\"" environments/prod/values.yaml
          done
          git diff

      - name: Commit and open a pull request
        working-directory: helm
        env:
          GH_TOKEN: ${{ secrets.HELM_REPO_TOKEN }}
          SERVICES: ${{ needs.changes.outputs.services }}
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if git diff --quiet; then
            echo "Image tags are already up to date, nothing to deploy"
            exit 0
          fi

          short_sha="${IMAGE_TAG:0:7}"
          services_list=$(echo "$SERVICES" | jq -r 'join(", ")')
          branch="deploy/${short_sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deploy(prod): ${services_list} @ ${short_sha}"
          git push --force -u origin "$branch"

          if gh pr view "$branch" > /dev/null 2>&1; then
            echo "A pull request for $branch already exists"
          else
            gh pr create --base main --head "$branch" \
              --title "deploy(prod): ${services_list} @ ${short_sha}" \
              --body "$(printf 'Updates the production image tag for: **%s**\n\nSource commit: %s\n\n> %s\n\nMerging this PR deploys to production: Argo CD syncs the main branch.' "$services_list" "$SOURCE_COMMIT" "$SOURCE_MESSAGE")"
          fi

  # The single check that branch protection requires
  ci-status:
    name: CI status
    if: always()
    needs: [changes, test, build-scan-push,update-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed or were skipped"
